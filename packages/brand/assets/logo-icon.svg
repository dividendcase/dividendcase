<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">

  <!-- Ground shadow -->
  <ellipse cx="100" cy="197" rx="65" ry="4" fill="#000000" opacity="0.15"/>

  <!-- ====== LEAVES ====== -->

  <!-- Left leaf -->
  <path d="M87,89 C80,76 68,56 73,34 C82,50 86,70 94,87Z" fill="#4a8c1a"/>
  <path d="M87,89 C84,77 80,60 73,34 C82,50 86,70 94,87Z" fill="#7abf50" opacity="0.4"/>
  <line x1="87" y1="89" x2="73" y2="34" stroke="#639922" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>

  <!-- Right leaf -->
  <path d="M113,89 C120,76 132,56 127,34 C118,50 114,70 106,87Z" fill="#4a8c1a"/>
  <path d="M113,89 C116,77 120,60 127,34 C118,50 114,70 106,87Z" fill="#7abf50" opacity="0.4"/>
  <line x1="113" y1="89" x2="127" y2="34" stroke="#639922" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>

  <!-- Center leaf (tallest) -->
  <path d="M100,90 C88,68 84,38 100,5 C116,38 112,68 100,90Z" fill="#2d6010"/>
  <path d="M100,90 C94,68 90,38 100,5 C100,38 100,68 100,90Z" fill="#5a9e2f" opacity="0.5"/>
  <line x1="100" y1="90" x2="100" y2="5" stroke="#639922" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>

  <!-- ====== VAULT BODY ====== -->

  <!-- Outer shell (depth) -->
  <rect x="15" y="86" width="170" height="103" rx="13" fill="#343444"/>

  <!-- Main face -->
  <rect x="19" y="90" width="162" height="95" rx="11" fill="#5c5c70"/>

  <!-- Gloss reflection -->
  <ellipse cx="63" cy="108" rx="22" ry="9" fill="white" opacity="0.055" transform="rotate(-18,63,108)"/>

  <!-- Corner accent top-right -->
  <path d="M164,97 Q177,97 177,110 L174,110 Q174,100 164,100Z" fill="#7878a0" opacity="0.3"/>

  <!-- ====== HINGE ====== -->
  <rect x="10" y="103" width="12" height="20" rx="3.5" fill="#8888a0"/>
  <rect x="11" y="104" width="4.5" height="18" rx="2" fill="#aaaabc" opacity="0.3"/>
  <rect x="10" y="133" width="12" height="20" rx="3.5" fill="#8888a0"/>
  <rect x="11" y="134" width="4.5" height="18" rx="2" fill="#aaaabc" opacity="0.3"/>

  <!-- ====== COMBINATION DIAL ====== -->

  <!-- Outer bezel -->
  <circle cx="114" cy="140" r="31" fill="#3a3a4e"/>

  <!-- Dial ring -->
  <circle cx="114" cy="140" r="27" fill="#7070a0"/>

  <!-- 12 tick marks -->
  <g transform="translate(114,140)">
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(0)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(30)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(60)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(90)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(120)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(150)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(180)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(210)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(240)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(270)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(300)"/>
    <rect x="-2" y="-26" width="4" height="7" rx="1.5" fill="#c0c0d8" transform="rotate(330)"/>
  </g>

  <!-- Dial face -->
  <circle cx="114" cy="140" r="18" fill="#d0d0e0"/>
  <circle cx="114" cy="140" r="17" fill="none" stroke="#9090b0" stroke-width="1"/>

  <!-- Dial centre knob -->
  <circle cx="114" cy="140" r="7" fill="#707090"/>
  <circle cx="114" cy="140" r="4" fill="#9090b0"/>
  <circle cx="114" cy="140" r="2" fill="#d0d0e0"/>

  <!-- Indicator notch -->
  <rect x="112.5" y="113" width="3" height="7" rx="1.5" fill="#2a2a38"/>

  <!-- ====== FEET ====== -->
  <rect x="30" y="184" width="28" height="11" rx="4" fill="#888898"/>
  <rect x="32" y="185" width="10" height="4" rx="2" fill="#b0b0c8" opacity="0.4"/>
  <rect x="142" y="184" width="28" height="11" rx="4" fill="#888898"/>
  <rect x="144" y="185" width="10" height="4" rx="2" fill="#b0b0c8" opacity="0.4"/>

</svg>
