name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface and website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: |
          npx tsc --noEmit -p frontend
          npx tsc --noEmit -p site
      - name: Build the website
        run: npm run build -w site

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the interface into the package
        run: uv run python scripts/build_web.py
      - name: Serve the built pages
        run: uv run pytest tests/test_api.py -k interface
      - name: Build the wheel and sdist
        run: uv build
      - name: Check them
        run: uv run python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  install:
    name: Install and run (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: uv tool install, as the README says
        run: |
          uv tool install "$(ls dist/*.whl)"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Start it and check it works
        run: uv run --no-project python scripts/smoke_test.py

  windows-app:
    name: Windows app (Microsoft Store package)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        shell: bash
        run: uv run --no-project python packaging/windows/build_msix.py "$(ls dist/*.whl)"
      # The Store signs what it publishes. To install the package here it needs a signature
      # this machine trusts, so it gets a throwaway certificate with the test identity's name.
      - name: Sign it with a test certificate and install it
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msix = (Get-ChildItem dist\*.msix).FullName
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=DividendCase Test" `
            -KeyUsage DigitalSignature -FriendlyName "DividendCase test build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE) { throw "signtool failed" }
          Add-AppxPackage -Path $msix
          $package = Get-AppxPackage -Name DividendCase.Test
          if (-not $package) { throw "The package isn't installed" }
          "INSTALL_LOCATION=$($package.InstallLocation)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_FAMILY=$($package.PackageFamilyName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installed $($package.PackageFullName) in $($package.InstallLocation)"
      # The full check runs on the folder the package was made from: Windows only lets an
      # installed Store app's programs start through the app itself (the next step)
      - name: Run the packaged copy and check it works
        shell: bash
        run: uv run --no-project python scripts/smoke_test.py build/msix/package/python/python.exe -I -m dividendcase.desktop --no-tray
      - name: Open it the way the Start menu does
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process "shell:AppsFolder\${env:PACKAGE_FAMILY}!DividendCase"
          $health = $null
          foreach ($i in 1..120) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8765/health -TimeoutSec 2; break } catch { Start-Sleep 1 }
          }
          if (-not $health) { throw "The app didn't answer within two minutes of opening it" }
          $info = Invoke-RestMethod http://127.0.0.1:8765/api/v1/app-info
          Write-Host "Version $($info.version), installed with: $($info.install_method)"
          if ($info.install_method -ne "store") { throw "Expected a Store install" }
          Invoke-WebRequest http://127.0.0.1:8765/dashboard/ -UseBasicParsing | Out-Null
          # Where the data really is: Windows keeps what a Store app writes under AppData in the
          # package's own storage, which uninstalling removes
          Write-Host "Data folder, as the app sees it: $($info.data_dir)"
          $own = "$env:LOCALAPPDATA\Packages\$env:PACKAGE_FAMILY\LocalCache\Local\DividendCase"
          Write-Host "Kept in the package's own storage ($own): $(Test-Path $own)"
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-test-build
          path: dist/*.msix
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dividendcase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it and check it works
        run: |
          docker run -d --name dividendcase -p 127.0.0.1:8765:8765 \
            -e DIVIDENDCASE_AUTO_REFRESH=false -e DIVIDENDCASE_CHECK_UPDATES=false dividendcase:ci
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/dashboard/ > /dev/null
          curl -sf http://127.0.0.1:8765/api/v1/app-info | grep -q '"install_method":"docker"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:8765/health)" = 400
          docker logs dividendcase | tail -5
