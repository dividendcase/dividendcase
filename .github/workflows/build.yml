name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface and website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: |
          npx tsc --noEmit -p frontend
          npx tsc --noEmit -p site
      - name: Build the website
        run: npm run build -w site

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the interface into the package
        run: uv run python scripts/build_web.py
      - name: Serve the built pages
        run: uv run pytest tests/test_api.py -k interface
      - name: Build the wheel and sdist
        run: uv build
      - name: Check them
        run: uv run python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  install:
    name: Install and run (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: uv tool install, as the README says
        run: |
          uv tool install "$(ls dist/*.whl)"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Start it and check it works
        run: uv run --no-project python scripts/smoke_test.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dividendcase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it and check it works
        run: |
          docker run -d --name dividendcase -p 127.0.0.1:8765:8765 \
            -e DIVIDENDCASE_AUTO_REFRESH=false -e DIVIDENDCASE_CHECK_UPDATES=false dividendcase:ci
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/dashboard/ > /dev/null
          curl -sf http://127.0.0.1:8765/api/v1/app-info | grep -q '"install_method":"docker"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:8765/health)" = 400
          docker logs dividendcase | tail -5
